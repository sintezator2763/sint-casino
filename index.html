<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINT-CASINO.COM — Главная</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Impact', sans-serif;
        }

        body {
            background: #080012;
            color: #fff;
            text-align: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .casino-card {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background: radial-gradient(circle, #1a002c 0%, #05000a 100%);
            border: 4px solid #ff007f;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 25px #ff007f;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff0055;
            margin-bottom: 2px;
        }

        .subtitle {
            color: #00ffff;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #00ffff;
        }

        /* Плашка баланса */
        .balance-bar {
            background: linear-gradient(90deg, #1f0036, #3a0066);
            border: 2px solid #00ff66;
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 1.2rem;
            color: #00ff66;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .balance-actions {
            display: flex;
            gap: 8px;
        }

        .balance-bar span.btn-action {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .balance-bar span.btn-action:hover {
            transform: scale(1.05);
        }

        .balance-bar span.plus {
            background: #00ff66;
            color: #000;
        }

        .balance-bar span.minus {
            background: #ff3366;
            color: #fff;
        }

        /* Сеть карточек игр */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .game-card {
            background: #110022;
            border: 2px solid #ff007f;
            border-radius: 12px;
            padding: 15px 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 15px #ff007f;
            border-color: #00ffff;
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .game-title {
            font-size: 0.95rem;
            color: #ffcc00;
        }

        /* Статистика */
        .stats-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            text-align: left;
            font-size: 0.85rem;
        }

        .stats-title {
            color: #00ffff;
            font-size: 1rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            border-bottom: 1px dashed #333;
            padding-bottom: 2px;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.93);
            border-radius: 20px;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #140024;
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            text-align: left;
        }

        .modal-content h3 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #ccc;
            margin-bottom: 3px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ff007f;
            background: #000;
            color: #fff;
            font-size: 0.9rem;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .error-msg {
            color: #ff3366;
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.3;
        }

        .modal-btn {
            width: 100%;
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 5px;
        }

        .modal-btn.withdraw-btn {
            background: #ff3366;
            color: #fff;
        }

        .close-btn {
            background: #444;
            color: #fff;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="casino-card">
        <h1>🎰 SINT-CASINO.COM 🎰</h1>
        <div class="subtitle">ГЛАВНАЯ ПАНЕЛЬ</div>

        <div class="balance-bar">
            <div>💰 БАЛАНС: <span id="balanceVal">0</span> ₽</div>
            <div class="balance-actions">
                <span class="btn-action plus" onclick="openDepositModal()">+ ПОПОЛНИТЬ</span>
                <span class="btn-action minus" onclick="openWithdrawModal()">- ВЫВЕСТИ</span>
            </div>
        </div>

        <div class="games-grid">
            <div class="game-card" onclick="goToGame('slots.html')">
                <div class="game-icon">🎰</div>
                <div class="game-title">СМЕШНЫЕ СЛОТЫ</div>
            </div>
            <div class="game-card" onclick="goToGame('jetx.html')">
                <div class="game-icon">🚀</div>
                <div class="game-title">JETX</div>
            </div>
            <div class="game-card" onclick="goToGame('roulette.html')">
                <div class="game-icon">🎯</div>
                <div class="game-title">РУЛЕТКА</div>
            </div>
            <div class="game-card" onclick="goToGame('dice.html')">
                <div class="game-icon">🎲</div>
                <div class="game-title">КОСТИ</div>
            </div>
        </div>

        <div class="stats-box">
            <div class="stats-title">📊 ВАША СТАТИСТИКА</div>
            <div class="stats-row"><span>Сыграно раундов:</span><span id="stSpins">0</span></div>
            <div class="stats-row"><span>Всего поставлено:</span><span id="stWagered">0 ₽</span></div>
            <div class="stats-row"><span>Всего выиграно:</span><span id="stWon">0 ₽</span></div>
            <div class="stats-row"><span>Макс. выигрыш:</span><span id="stBiggest">0 ₽</span></div>
        </div>

        <!-- Модалка пополнения -->
        <div class="modal" id="depositModal">
            <div class="modal-content">
                <h3>💳 ПОПОЛНЕНИЕ БАЛАНСА</h3>
                <div class="form-group">
                    <label>Номер карты (16 цифр):</label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="form-row">
                    <div class="form-group" style="width: 50%;">
                        <label>Срок (ММ/ГГ):</label>
                        <input type="text" id="cardExp" placeholder="ММ/ГГ" maxlength="5">
                    </div>
                    <div class="form-group" style="width: 50%;">
                        <label>CVC / CVV:</label>
                        <input type="password" id="cardCvc" placeholder="000" maxlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label>Сумма пополнения (от 100 до 10 000 ₽):</label>
                    <input type="number" id="depositAmount" placeholder="1000" min="100" max="10000">
                </div>
                <div id="depositError" class="error-msg"></div>
                <button class="modal-btn" onclick="processDeposit()">ПОПОЛНИТЬ</button>
                <button class="modal-btn close-btn" onclick="closeDepositModal()">ОТМЕНА</button>
            </div>
        </div>

        <!-- Модалка вывода -->
        <div class="modal" id="withdrawModal">
            <div class="modal-content" style="border-color: #ff3366;">
                <h3 style="color: #ff3366;">💸 ВЫВОД СРЕДСТВ</h3>
                <div class="form-group">
                    <label>Номер карты для получения (16 цифр):</label>
                    <input type="text" id="withdrawCardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="form-row">
                    <div class="form-group" style="width: 50%;">
                        <label>Срок (ММ/ГГ):</label>
                        <input type="text" id="withdrawCardExp" placeholder="ММ/ГГ" maxlength="5">
                    </div>
                    <div class="form-group" style="width: 50%;">
                        <label>CVC / CVV:</label>
                        <input type="password" id="withdrawCardCvc" placeholder="000" maxlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label>Сумма вывода (от 100 до 10 000 ₽):</label>
                    <input type="number" id="withdrawAmount" placeholder="1000" min="100" max="10000">
                </div>
                <div id="withdrawError" class="error-msg"></div>
                <button class="modal-btn withdraw-btn" onclick="processWithdraw()">ВЫВЕСТИ СРЕДСТВА</button>
                <button class="modal-btn close-btn" onclick="closeWithdrawModal()">ОТМЕНА</button>
            </div>
        </div>
    </div>

    <script>
        // Единый ключ баланса
        const SINT_BALANCE_KEY = 'sint_casino_balance';
        const SINT_DEFAULT_BALANCE = 0;

        function sintGetBalance() {
            const raw = localStorage.getItem(SINT_BALANCE_KEY);
            if (raw === null) {
                localStorage.setItem(SINT_BALANCE_KEY, String(SINT_DEFAULT_BALANCE));
                return SINT_DEFAULT_BALANCE;
            }
            const val = parseFloat(raw);
            return isNaN(val) ? 0 : val;
        }

        function sintSetBalance(newVal) {
            const rounded = Math.max(0, Math.round(newVal));
            localStorage.setItem(SINT_BALANCE_KEY, String(rounded));
            sintRenderBalance();
            return rounded;
        }

        function sintAddBalance(delta) {
            return sintSetBalance(sintGetBalance() + delta);
        }

        function sintRenderBalance() {
            document.querySelectorAll('#balanceVal').forEach(el => {
                el.innerText = sintGetBalance().toLocaleString();
            });
        }

        window.addEventListener('storage', (e) => {
            if (e.key === SINT_BALANCE_KEY) sintRenderBalance();
            if (e.key === SINT_STATS_KEY) sintRenderStats();
        });

        // Статистика
        const SINT_STATS_KEY = 'sint_casino_stats';

        function sintGetStats() {
            const defaults = { spins: 0, wagered: 0, won: 0, biggestWin: 0 };
            const raw = localStorage.getItem(SINT_STATS_KEY);
            if (!raw) return defaults;
            try {
                return Object.assign({}, defaults, JSON.parse(raw));
            } catch (e) {
                return defaults;
            }
        }

        function sintRenderStats() {
            const stats = sintGetStats();
            document.getElementById('stSpins').innerText = stats.spins.toLocaleString();
            document.getElementById('stWagered').innerText = stats.wagered.toLocaleString() + ' ₽';
            document.getElementById('stWon').innerText = stats.won.toLocaleString() + ' ₽';
            document.getElementById('stBiggest').innerText = stats.biggestWin.toLocaleString() + ' ₽';
        }

        // Переход на страницы игр
        function goToGame(url) {
            window.location.href = url;
        }

        document.addEventListener('DOMContentLoaded', () => {
            sintRenderBalance();
            sintRenderStats();
        });

        // --- Пополнение ---
        function openDepositModal() {
            document.getElementById('depositModal').classList.add('active');
            document.getElementById('depositError').innerText = '';
        }

        function closeDepositModal() {
            document.getElementById('depositModal').classList.remove('active');
        }

        document.getElementById('cardNumber')?.addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            val = val.replace(/(.{4})/g, '$1 ').trim();
            e.target.value = val.substring(0, 19);
        });

        document.getElementById('cardExp')?.addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length >= 2) val = val.substring(0, 2) + '/' + val.substring(2, 4);
            e.target.value = val.substring(0, 5);
        });

        function processDeposit() {
            const cardNum = document.getElementById('cardNumber').value.replace(/\s+/g, '');
            const cardExp = document.getElementById('cardExp').value;
            const cardCvc = document.getElementById('cardCvc').value;
            const amount = parseInt(document.getElementById('depositAmount').value);
            const errorEl = document.getElementById('depositError');

            if (!/^\d{16}$/.test(cardNum)) {
                errorEl.innerText = '❌ Неверный номер карты! Должно быть 16 цифр.';
                return;
            }
            if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(cardExp)) {
                errorEl.innerText = '❌ Неверный срок действия! Формат: ММ/ГГ (например, 05/28).';
                return;
            }
            if (!/^\d{3}$/.test(cardCvc)) {
                errorEl.innerText = '❌ Неверный CVC код! Должно быть 3 цифры.';
                return;
            }
            if (isNaN(amount) || amount < 100 || amount > 10000) {
                errorEl.innerText = '❌ Сумма пополнения должна быть от 100 до 10 000 ₽!';
                return;
            }

            sintAddBalance(amount);
            closeDepositModal();
            alert(`Успешно! Баланс пополнен на ${amount.toLocaleString()} ₽`);

            document.getElementById('cardNumber').value = '';
            document.getElementById('cardExp').value = '';
            document.getElementById('cardCvc').value = '';
            document.getElementById('depositAmount').value = '';
        }

        // --- Вывод средств ---
        function openWithdrawModal() {
            document.getElementById('withdrawModal').classList.add('active');
            document.getElementById('withdrawError').innerText = '';
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').classList.remove('active');
        }

        document.getElementById('withdrawCardNumber')?.addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            val = val.replace(/(.{4})/g, '$1 ').trim();
            e.target.value = val.substring(0, 19);
        });

        document.getElementById('withdrawCardExp')?.addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length >= 2) val = val.substring(0, 2) + '/' + val.substring(2, 4);
            e.target.value = val.substring(0, 5);
        });

        function processWithdraw() {
            const cardNum = document.getElementById('withdrawCardNumber').value.replace(/\s+/g, '');
            const cardExp = document.getElementById('withdrawCardExp').value;
            const cardCvc = document.getElementById('withdrawCardCvc').value;
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            const errorEl = document.getElementById('withdrawError');

            if (!/^\d{16}$/.test(cardNum)) {
                errorEl.innerText = '❌ Неверный номер карты! Должно быть 16 цифр.';
                return;
            }
            if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(cardExp)) {
                errorEl.innerText = '❌ Неверный срок действия! Формат: ММ/ГГ (например, 08/27).';
                return;
            }
            if (!/^\d{3}$/.test(cardCvc)) {
                errorEl.innerText = '❌ Неверный CVC/CVV код! Введите 3 цифры.';
                return;
            }
            if (isNaN(amount) || amount < 100 || amount > 10000) {
                errorEl.innerText = '❌ Вывод возможен только от 100 до 10 000 ₽.';
                return;
            }
            if (amount > sintGetBalance()) {
                errorEl.innerText = '❌ Недостаточно средств на балансе!';
                return;
            }

            errorEl.innerText = '❌ Ошибка #2763: Транзакция отклонена шлюзом! Для активации вывода необходимо совершить повторное пополнение аккаунта на такую же сумму.';
        }
    </script>
</body>
</html>
