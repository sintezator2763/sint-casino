<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINT-CASINO.COM — Смешные Слоты</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Impact', sans-serif;
        }

        body {
            background: #080012;
            color: #fff;
            text-align: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .casino-card {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background: radial-gradient(circle, #1a002c 0%, #05000a 100%);
            border: 4px solid #ff007f;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 25px #ff007f;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff0055;
            margin-bottom: 2px;
        }

        .subtitle {
            color: #00ffff;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #00ffff;
        }

        /* Плашка баланса */
        .balance-bar {
            background: linear-gradient(90deg, #1f0036, #3a0066);
            border: 2px solid #00ff66;
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 1.2rem;
            color: #00ff66;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .balance-actions {
            display: flex;
            gap: 8px;
        }

        .balance-bar span.btn-action {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .balance-bar span.btn-action:hover {
            transform: scale(1.05);
        }

        .balance-bar span.plus {
            background: #00ff66;
            color: #000;
        }

        .balance-bar span.minus {
            background: #ff3366;
            color: #fff;
        }

        /* Промокоды */
        .promo-box {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .promo-box input {
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #ff007f;
            background: #000;
            color: #fff;
            text-align: center;
            font-size: 0.9rem;
            text-transform: uppercase;
            width: 60%;
        }

        .promo-box button {
            background: #ff007f;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .promo-msg {
            font-size: 0.85rem;
            margin-bottom: 10px;
            min-height: 18px;
        }

        /* Слоты */
        .slot-container {
            background: #000;
            border: 4px solid #ffcc00;
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .cost-info {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        /* Барабаны — реальная прокрутка */
        .reel-window {
            width: 85px;
            height: 105px;
            background: #111;
            border: 2px solid #ff007f;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .reel-symbol {
            width: 85px;
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            user-select: none;
            flex-shrink: 0;
        }

        .btn-spin {
            background: linear-gradient(180deg, #ffcc00, #ff6600);
            border: none;
            color: #000;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 12px 35px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b34700;
            text-transform: uppercase;
        }

        .btn-spin:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b34700;
        }

        .btn-spin:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.93);
            border-radius: 20px;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #140024;
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            text-align: left;
        }

        .modal-content h3 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #ccc;
            margin-bottom: 3px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ff007f;
            background: #000;
            color: #fff;
            font-size: 0.9rem;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .error-msg {
            color: #ff3366;
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.3;
        }

        .modal-btn {
            width: 100%;
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 5px;
        }

        .modal-btn.withdraw-btn {
            background: #ff3366;
            color: #fff;
        }

        .close-btn {
            background: #444;
            color: #fff;
            margin-top: 5px;
        }

        /* Модалка ДЖЕКПОТ */
        .jackpot-title {
            font-size: 2.2rem;
            color: #ffcc00;
            text-shadow: 0 0 15px #ff0055;
            margin-bottom: 10px;
            animation: pulse 0.3s infinite alternate;
        }

        .win-amount {
            font-size: 2rem;
            color: #00ff66;
            margin: 15px 0;
            text-shadow: 0 0 10px #00ff66;
        }
    </style>
</head>
<body>

    <div class="casino-card">
        <h1>🎰 SINT-CASINO.COM 🎰</h1>
        <div class="subtitle">СМЕШНЫЕ СЛОТЫ</div>

        <div class="balance-bar">
            <div>💰 БАЛАНС: <span id="balanceVal">0</span> ₽</div>
            <div class="balance-actions">
                <span class="btn-action plus" onclick="openDepositModal()">+ ПОПОЛНИТЬ</span>
                <span class="btn-action minus" onclick="openWithdrawModal()">- ВЫВЕСТИ</span>
            </div>
        </div>

        <div class="promo-box">
            <input type="text" id="promoInput" placeholder="ПРОМОКОД">
            <button onclick="activatePromo()">ОК</button>
        </div>
        <div id="promoMsg" class="promo-msg"></div>

        <div class="slot-container">
            <div class="reel-window"><div class="reel-strip" id="strip1"><div class="reel-symbol">💸</div></div></div>
            <div class="reel-window"><div class="reel-strip" id="strip2"><div class="reel-symbol">💸</div></div></div>
            <div class="reel-window"><div class="reel-strip" id="strip3"><div class="reel-symbol">💸</div></div></div>
        </div>

        <div class="cost-info">Стоимость спина: <span id="spinCostVal">100</span> ₽</div>
        <button class="btn-spin" id="spinBtn" onclick="spin()">КРУТИТЬ 🔥</button>

        <div class="modal" id="depositModal">
            <div class="modal-content">
                <h3>💳 ПОПОЛНЕНИЕ БАЛАНСА</h3>
                <div class="form-group">
                    <label>Номер карты (16 цифр):</label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="form-row">
                    <div class="form-group" style="width: 50%;">
                        <label>Срок (ММ/ГГ):</label>
                        <input type="text" id="cardExp" placeholder="ММ/ГГ" maxlength="5">
                    </div>
                    <div class="form-group" style="width: 50%;">
                        <label>CVC / CVV:</label>
                        <input type="password" id="cardCvc" placeholder="000" maxlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label>Сумма пополнения (от 100 до 10 000 ₽):</label>
                    <input type="number" id="depositAmount" placeholder="1000" min="100" max="10000">
                </div>
                <div id="depositError" class="error-msg"></div>
                <button class="modal-btn" onclick="processDeposit()">ПОПОЛНИТЬ</button>
                <button class="modal-btn close-btn" onclick="closeDepositModal()">ОТМЕНА</button>
            </div>
        </div>

        <div class="modal" id="withdrawModal">
            <div class="modal-content" style="border-color: #ff3366;">
                <h3 style="color: #ff3366;">💸 ВЫВОД СРЕДСТВ</h3>
                <div class="form-group">
                    <label>Номер карты для получения (16 цифр):</label>
                    <input type="text" id="withdrawCardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="form-row">
                    <div class="form-group" style="width: 50%;">
                        <label>Срок (ММ/ГГ):</label>
                        <input type="text" id="withdrawCardExp" placeholder="ММ/ГГ" maxlength="5">
                    </div>
                    <div class="form-group" style="width: 50%;">
                        <label>CVC / CVV:</label>
                        <input type="password" id="withdrawCardCvc" placeholder="000" maxlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label>Сумма вывода (от 100 до 10 000 ₽):</label>
                    <input type="number" id="withdrawAmount" placeholder="1000" min="100" max="10000">
                </div>
                <div id="withdrawError" class="error-msg"></div>
                <button class="modal-btn withdraw-btn" onclick="processWithdraw()">ВЫВЕСТИ СРЕДСТВА</button>
                <button class="modal-btn close-btn" onclick="closeWithdrawModal()">ОТМЕНА</button>
            </div>
        </div>

        <div class="modal" id="jackpotModal">
            <div class="jackpot-title">🚨 MEGA JACKPOT! 🚨</div>
            <div style="font-size: 1.1rem; color: #fff;">ВЫ ВЫБИЛИ 3 ОДИНАКОВЫХ СИМВОЛА!</div>
            <div class="win-amount" id="winCounter">0 ₽</div>
            <button class="btn-spin" onclick="closeJackpotModal()">ЗАБРАТЬ ВЫИГРЫШ 💸</button>
        </div>
    </div>

    <script>
// =========================================================
// 💾 ОБЩИЙ БАЛАНС ДЛЯ ВСЕХ ИГР SINT-CASINO (localStorage)
// =========================================================

const SINT_BALANCE_KEY = 'sint_casino_balance';
const SINT_DEFAULT_BALANCE = 0;

function sintGetBalance() {
    const raw = localStorage.getItem(SINT_BALANCE_KEY);
    if (raw === null) {
        localStorage.setItem(SINT_BALANCE_KEY, String(SINT_DEFAULT_BALANCE));
        return SINT_DEFAULT_BALANCE;
    }
    const val = parseFloat(raw);
    return isNaN(val) ? 0 : val;
}

function sintSetBalance(newVal) {
    const rounded = Math.max(0, Math.round(newVal));
    localStorage.setItem(SINT_BALANCE_KEY, String(rounded));
    sintRenderBalance();
    return rounded;
}

function sintAddBalance(delta) {
    return sintSetBalance(sintGetBalance() + delta);
}

function sintRenderBalance() {
    document.querySelectorAll('#balanceVal').forEach(el => {
        el.innerText = sintGetBalance().toLocaleString();
    });
}

// Синхронизация баланса между открытыми вкладками/играми в реальном времени
window.addEventListener('storage', (e) => {
    if (e.key === SINT_BALANCE_KEY) sintRenderBalance();
});

// --- Общий звук (простой бипер на Web Audio API) ---
let sintAudioCtx = null;
function sintPlaySound(freq, duration = 0.1) {
    try {
        if (!sintAudioCtx) sintAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (sintAudioCtx.state === 'suspended') sintAudioCtx.resume();
        let osc = sintAudioCtx.createOscillator();
        let gain = sintAudioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, sintAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, sintAudioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(sintAudioCtx.destination);
        osc.start();
        osc.stop(sintAudioCtx.currentTime + duration);
    } catch (e) {}
}


// =========================================================
// 📊 ОБЩАЯ СТАТИСТИКА ДЛЯ ВСЕХ ИГР (localStorage)
// =========================================================

const SINT_STATS_KEY = 'sint_casino_stats';

function sintGetStats() {
    const defaults = { spins: 0, wagered: 0, won: 0, biggestWin: 0, slots: 0, roulette: 0, jetx: 0 };
    const raw = localStorage.getItem(SINT_STATS_KEY);
    if (!raw) return defaults;
    try {
        return Object.assign({}, defaults, JSON.parse(raw));
    } catch (e) {
        return defaults;
    }
}

function sintRecordRound(game, wagered, won) {
    const stats = sintGetStats();
    stats.spins += 1;
    stats.wagered += wagered;
    stats.won += won;
    if (won > stats.biggestWin) stats.biggestWin = won;
    if (stats[game] !== undefined) stats[game] += 1;
    localStorage.setItem(SINT_STATS_KEY, JSON.stringify(stats));
}

document.addEventListener('DOMContentLoaded', sintRenderBalance);
    </script>
    <script>
        // =========================================================
        // ⚙️ НАСТРОЙКИ КАЗИНО
        // =========================================================

        const EMOJI_LIST = ['💸', '🪲', '🐑', '🧤', '👑', '💎', '💰', '🚀', '🌽', '🪤', '🌋', '📞'];

        const PROMO_CODES = {
            'RAKETA': 5000,
            'FAMILY': 75000
        };

        const SPIN_COST = 100;
        const SYMBOL_HEIGHT = 105;

        // =========================================================
        // 🧠 ЛОГИКА ИГРЫ
        // =========================================================

        let usedPromos = new Set();

        document.getElementById('spinCostVal').innerText = SPIN_COST;

        function updateBalanceUI() {
            sintRenderBalance();
        }

        function playSound(freq) {
            sintPlaySound(freq);
        }

        // --- Промокоды ---
        function activatePromo() {
            const input = document.getElementById('promoInput');
            const msg = document.getElementById('promoMsg');
            const code = input.value.trim().toUpperCase();

            if (!code) return;

            if (usedPromos.has(code)) {
                msg.style.color = '#ff3366';
                msg.innerText = '❌ Этот промокод уже был активирован!';
                return;
            }

            if (PROMO_CODES.hasOwnProperty(code)) {
                const reward = PROMO_CODES[code];
                sintAddBalance(reward);
                usedPromos.add(code);
                msg.style.color = '#00ff66';
                msg.innerText = `✅ Промокод ${code} активирован! +${reward.toLocaleString()} ₽`;
                input.value = '';
            } else {
                msg.style.color = '#ff3366';
                msg.innerText = '❌ Неверный промокод!';
            }
        }

        // --- Пополнение и Валидация Карты ---
        function openDepositModal() {
            document.getElementById('depositModal').classList.add('active');
            document.getElementById('depositError').innerText = '';
        }

        function closeDepositModal() {
            document.getElementById('depositModal').classList.remove('active');
        }

        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            val = val.replace(/(.{4})/g, '$1 ').trim();
            e.target.value = val.substring(0, 19);
        });

        document.getElementById('cardExp').addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length >= 2) {
                val = val.substring(0, 2) + '/' + val.substring(2, 4);
            }
            e.target.value = val.substring(0, 5);
        });

        function processDeposit() {
            const cardNum = document.getElementById('cardNumber').value.replace(/\s+/g, '');
            const cardExp = document.getElementById('cardExp').value;
            const cardCvc = document.getElementById('cardCvc').value;
            const amount = parseInt(document.getElementById('depositAmount').value);
            const errorEl = document.getElementById('depositError');

            if (!/^\d{16}$/.test(cardNum)) {
                errorEl.innerText = '❌ Неверный номер карты! Должно быть 16 цифр.';
                return;
            }

            if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(cardExp)) {
                errorEl.innerText = '❌ Неверный срок действия! Формат: ММ/ГГ (например, 05/28).';
                return;
            }

            if (!/^\d{3}$/.test(cardCvc)) {
                errorEl.innerText = '❌ Неверный CVC код! Должно быть 3 цифры.';
                return;
            }

            if (isNaN(amount) || amount < 100 || amount > 10000) {
                errorEl.innerText = '❌ Сумма пополнения должна быть от 100 до 10 000 ₽!';
                return;
            }

            sintAddBalance(amount);
            closeDepositModal();
            alert(`Успешно! Баланс пополнен на ${amount.toLocaleString()} ₽`);

            document.getElementById('cardNumber').value = '';
            document.getElementById('cardExp').value = '';
            document.getElementById('cardCvc').value = '';
            document.getElementById('depositAmount').value = '';
        }

        // --- Вывод средств ---
        function openWithdrawModal() {
            document.getElementById('withdrawModal').classList.add('active');
            document.getElementById('withdrawError').innerText = '';
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').classList.remove('active');
        }

        document.getElementById('withdrawCardNumber').addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            val = val.replace(/(.{4})/g, '$1 ').trim();
            e.target.value = val.substring(0, 19);
        });

        document.getElementById('withdrawCardExp').addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length >= 2) {
                val = val.substring(0, 2) + '/' + val.substring(2, 4);
            }
            e.target.value = val.substring(0, 5);
        });

        function processWithdraw() {
            const cardNum = document.getElementById('withdrawCardNumber').value.replace(/\s+/g, '');
            const cardExp = document.getElementById('withdrawCardExp').value;
            const cardCvc = document.getElementById('withdrawCardCvc').value;
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            const errorEl = document.getElementById('withdrawError');

            // 1. Проверка номера карты (16 цифр)
            if (!/^\d{16}$/.test(cardNum)) {
                errorEl.innerText = '❌ Неверный номер карты! Номер должен состоять из 16 цифр.';
                return;
            }

            // 2. Проверка срока действия (MM/YY)
            if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(cardExp)) {
                errorEl.innerText = '❌ Неверный срок действия! Формат: ММ/ГГ (например, 08/27).';
                return;
            }

            // 3. Проверка CVC (3 цифры)
            if (!/^\d{3}$/.test(cardCvc)) {
                errorEl.innerText = '❌ Неверный CVC/CVV код! Введите 3 цифры с оборота карты.';
                return;
            }

            // 4. Проверка корректности суммы
            if (isNaN(amount) || amount < 100 || amount > 10000) {
                errorEl.innerText = '❌ Недопустимая сумма! Вывод возможен от 100 до 10 000 ₽.';
                return;
            }

            // 5. Проверка баланса
            if (amount > sintGetBalance()) {
                errorEl.innerText = '❌ Недостаточно средств на балансе для вывода этой суммы!';
                return;
            }

            // ЕСЛИ ВСЕ ДАННЫЕ ВВЕДЕНЫ ВЕРНО -> ФЕЙКОВАЯ ОШИБКА КАССЫ
            errorEl.innerText = '❌ Ошибка #2763: Транзакция отклонена шлюзом! Для активации вывода необходимо совершить повторное пополнение аккаунта на такую же сумму.';
        }

        // --- Вращение Слотов (настоящая прокрутка ленты символов) ---
        function randSymbol() {
            return EMOJI_LIST[Math.floor(Math.random() * EMOJI_LIST.length)];
        }

        // Прокручивает одну ленту до заданного итогового символа за duration мс
        function spinReel(stripId, finalSymbol, duration) {
            return new Promise(resolve => {
                const strip = document.getElementById(stripId);
                const EXTRA = 18; // сколько "лишних" символов проматываем для эффекта скорости

                // Строим ленту: случайные символы + финальный в конце
                let html = '';
                for (let i = 0; i < EXTRA; i++) {
                    html += `<div class="reel-symbol">${randSymbol()}</div>`;
                }
                html += `<div class="reel-symbol">${finalSymbol}</div>`;
                strip.innerHTML = html;

                // Сбрасываем позицию без анимации
                strip.style.transition = 'none';
                strip.style.transform = 'translateY(0px)';
                // Форсируем reflow, чтобы браузер применил сброс перед стартом анимации
                void strip.offsetHeight;

                const targetY = -(EXTRA * SYMBOL_HEIGHT);
                strip.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.85, 0.25, 1)`;
                strip.style.transform = `translateY(${targetY}px)`;

                setTimeout(resolve, duration);
            });
        }

        function spin() {
            const msg = document.getElementById('promoMsg');
            msg.innerText = '';

            if (sintGetBalance() < SPIN_COST) {
                msg.style.color = '#ff3366';
                msg.innerText = '❌ Недостаточно средств!';
                return;
            }

            sintAddBalance(-SPIN_COST);

            const btn = document.getElementById('spinBtn');
            btn.disabled = true;

            // Итог каждого барабана известен заранее, но игрок видит его только когда лента доезжает
            const res1 = randSymbol();
            const res2 = randSymbol();
            const res3 = randSymbol();

            let tickTimer = setInterval(() => playSound(180 + Math.random() * 100), 90);

            Promise.all([
                spinReel('strip1', res1, 900),
                spinReel('strip2', res2, 1400),
                spinReel('strip3', res3, 1900)
            ]).then(() => {
                clearInterval(tickTimer);
                btn.disabled = false;
                checkWin(res1, res2, res3);
            });
        }

        // Проверка выигрыша
        function checkWin(e1, e2, e3) {
            const msg = document.getElementById('promoMsg');
            let roundWin = 0;

            if (e1 === e2 && e2 === e3) {
                const jackpotWin = Math.floor(Math.random() * 4500000) + 500000;
                roundWin = jackpotWin;
                sintAddBalance(jackpotWin);
                showJackpotModal(jackpotWin);
            }
            else if (e1 === e2 || e2 === e3 || e1 === e3) {
                const smallWin = 500;
                roundWin = smallWin;
                sintAddBalance(smallWin);
                msg.style.color = '#00ff66';
                msg.innerText = `🎉 ДВА СОВПАДЕНИЯ! Вы выиграли ${smallWin} ₽!`;
            } else {
                msg.style.color = '#aaa';
                msg.innerText = 'Не повезло! Попробуйте еще раз.';
            }

            sintRecordRound('slots', SPIN_COST, roundWin);
        }

        function showJackpotModal(winVal) {
            document.getElementById('jackpotModal').classList.add('active');
            let count = 0;
            let timer = setInterval(() => {
                count += Math.floor(winVal / 15);
                if (count >= winVal) {
                    count = winVal;
                    clearInterval(timer);
                }
                document.getElementById('winCounter').innerText = count.toLocaleString() + ' ₽';
            }, 40);
        }

        function closeJackpotModal() {
            document.getElementById('jackpotModal').classList.remove('active');
        }

    </script>
</body>
</html>
